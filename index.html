<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14281d">
  <title>ApartaShower | Simulacro Navideño 🎄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="snow-layer" aria-hidden="true"></div>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main id="app" aria-live="polite"></main>

  <audio id="clickSound" src="audio/click.mp3" preload="auto"></audio>
  <audio id="spinSound" src="audio/spin.mp3" preload="auto"></audio>
  <audio id="successSound" src="audio/success.mp3" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="app.js"></script>

</html>
